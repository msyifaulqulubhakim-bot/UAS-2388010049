version: "3.9"

networks:
  app_network:
    driver: bridge

volumes:
  db_data:

services:

  # ─── REVERSE PROXY ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web_statis
      - web_dinamis
    networks:
      - app_network
    restart: unless-stopped

  # ─── WEB STATIS (CV HTML) ────────────────────────────────
  web_statis:
    image: hakim0901/web_statis:latest
    container_name: web_statis
    expose:
      - "80"
    networks:
      - app_network
    restart: unless-stopped

  # ─── WEB DINAMIS (PHP + MariaDB) ─────────────────────────
  web_dinamis:
    image: hakim0901/web_dinamis:latest
    container_name: web_dinamis
    expose:
      - "80"
    environment:
      DB_HOST: db
      DB_NAME: app_db
      DB_USER: appuser
      DB_PASS: ${DB_PASS:-apppassword}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  # ─── DATABASE (MariaDB) ───────────────────────────────────
  db:
    image: mariadb:10.11
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE:      app_db
      MYSQL_USER:          appuser
      MYSQL_PASSWORD:      ${DB_PASS:-apppassword}
    volumes:
      - db_data:/var/lib/mysql
      - ./web_dinamis/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "3306"
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
