name: CI/CD — Web Dinamis (PHP)

on:
  push:
    branches: [main]
    paths:
      - "web_dinamis/**"
      - ".github/workflows/web_dinamis.yml"

env:
  IMAGE_NAME: hakim0901/web_dinamis

jobs:
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./web_dinamis
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/default.conf,web_dinamis/db/init.sql"
          target: "~/app"

      - name: SSH & Deploy (Zero Downtime)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            cd ~/app
            echo "DB_PASS=${{ secrets.DB_PASS }}" > .env
            echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env
            docker compose up -d db
            echo "⏳ Waiting for MariaDB to be ready..."
            sleep 15
            docker pull hakim0901/web_dinamis:latest
            docker compose up -d --no-deps --force-recreate web_dinamis nginx
            docker image prune -f
            echo "✅ Web Dinamis deployed successfully!"